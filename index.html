<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>じがくネタジェネレーター</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #fff9e6 0%, #fff0f6 50%, #e8f4ff 100%);
    font-family: 'Hiragino Maru Gothic ProN', 'BIZ UDGothic', 'Noto Sans JP', sans-serif;
    display: flex; flex-direction: column; align-items: center;
  }
  header {
    width: 100%;
    background: linear-gradient(90deg, #ff6b9d, #ffa94d);
    padding: 18px 24px 14px;
    text-align: center;
    box-shadow: 0 4px 16px rgba(255,107,157,0.3);
  }
  header .icon { font-size: 28px; margin-bottom: 2px; }
  header h1 { font-size: 22px; font-weight: 900; color: #fff; letter-spacing: 2px; text-shadow: 0 2px 8px rgba(0,0,0,0.15); }
  header p { margin-top: 4px; color: rgba(255,255,255,0.9); font-size: 13px; }

  main { width: 100%; max-width: 480px; padding: 20px 16px; }

  .section { margin-bottom: 20px; }
  .section-label { font-size: 15px; font-weight: 800; color: #555; margin-bottom: 10px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 10px 16px; border-radius: 50px;
    border: 2px solid #e0e0e0; background: #fff;
    color: #666; font-size: 14px; font-weight: 700;
    cursor: pointer; transition: all 0.15s;
    font-family: inherit;
  }
  .chip.selected {
    border-color: #ff6b9d; background: #ff6b9d;
    color: #fff; box-shadow: 0 4px 12px rgba(255,107,157,0.4);
  }

  .subject-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .subject-card {
    padding: 12px 8px; border-radius: 16px;
    border: 2px solid #eee; background: #fff;
    color: #555; font-size: 14px; font-weight: 700;
    cursor: pointer; transition: all 0.15s;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-family: inherit;
  }
  .subject-card .emoji { font-size: 18px; }
  .subject-card.selected {
    border-color: #ff6b9d; background: #fff0f6;
    color: #ff6b9d; box-shadow: 0 4px 12px rgba(255,107,157,0.2);
  }

  #generate-btn {
    width: 100%; padding: 18px; border-radius: 20px; border: none;
    background: #e0e0e0; color: #aaa;
    font-size: 20px; font-weight: 900; letter-spacing: 2px;
    cursor: not-allowed; transition: all 0.2s; margin-bottom: 20px;
    font-family: inherit;
  }
  #generate-btn.ready {
    background: linear-gradient(90deg, #ff6b9d, #ffa94d);
    color: #fff; cursor: pointer;
    box-shadow: 0 6px 20px rgba(255,107,157,0.4);
  }
  #generate-btn.ready:active { transform: scale(0.97); }

  #result-area { display: none; }
  #result-area.visible {
    display: block;
    animation: slideUp 0.4s ease;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .result-card {
    background: #fff; border-radius: 24px;
    padding: 24px 20px;
    box-shadow: 0 8px 32px rgba(255,107,157,0.15);
    border: 3px solid #ffe0ec;
  }
  .result-header { text-align: center; margin-bottom: 16px; }
  .result-emoji { font-size: 52px; margin-bottom: 8px; }
  .result-title {
    background: linear-gradient(90deg, #ff6b9d, #ffa94d);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    font-size: 20px; font-weight: 900; line-height: 1.3;
  }
  .result-desc {
    background: #fff9e6; border-radius: 14px;
    padding: 12px 16px; font-size: 14px; color: #555;
    line-height: 1.7; margin-bottom: 14px;
  }
  .steps-label { font-size: 13px; font-weight: 700; color: #ff6b9d; margin-bottom: 8px; }
  .step {
    display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px;
  }
  .step-num {
    min-width: 24px; height: 24px; border-radius: 50%;
    background: linear-gradient(135deg, #ff6b9d, #ffa94d);
    color: #fff; font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .step-text { font-size: 14px; color: #444; line-height: 1.6; }
  .tip-box {
    background: linear-gradient(90deg, #fff0f6, #fff9e6);
    border-radius: 14px; padding: 10px 14px;
    font-size: 13px; color: #888;
    border-left: 4px solid #ffa94d;
    margin-top: 14px;
  }
  .result-buttons { display: flex; gap: 10px; margin-top: 18px; }
  .btn-another {
    flex: 1; padding: 14px; border-radius: 16px;
    border: 2px solid #ff6b9d; background: #fff;
    color: #ff6b9d; font-size: 14px; font-weight: 700;
    cursor: pointer; font-family: inherit;
  }
  .btn-reset {
    flex: 1; padding: 14px; border-radius: 16px;
    border: none;
    background: linear-gradient(90deg, #ff6b9d, #ffa94d);
    color: #fff; font-size: 14px; font-weight: 700;
    cursor: pointer; font-family: inherit;
  }
  .btn-note {
    width: 100%; padding: 14px; border-radius: 16px; margin-top: 10px;
    border: 2px solid #7c9fd4; background: #f0f6ff;
    color: #3a6bc4; font-size: 15px; font-weight: 800;
    cursor: pointer; font-family: inherit;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn-note:active { transform: scale(0.97); }

  /* ノートモーダル */
  #note-modal {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.55); z-index: 1000;
    align-items: center; justify-content: center;
    padding: 16px;
  }
  #note-modal.open { display: flex; animation: fadeIn 0.25s ease; }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

  .note-wrap {
    width: 100%; max-width: 420px; max-height: 90vh;
    overflow-y: auto; position: relative;
  }
  .note-book {
    background: #fffef5;
    border-radius: 4px 12px 12px 4px;
    box-shadow: -6px 0 0 #c8a97a, 4px 4px 24px rgba(0,0,0,0.3), inset 0 0 0 1px #e8e0c8;
    position: relative; overflow: hidden;
  }
  /* 左側の製本部分 */
  .note-book::before {
    content: '';
    position: absolute; left: 0; top: 0; bottom: 0; width: 28px;
    background: linear-gradient(to right, #b8935a, #d4aa72, #c9a060);
    z-index: 2;
  }
  /* 穴 */
  .note-book::after {
    content: '';
    position: absolute; left: 10px; top: 0; bottom: 0; width: 8px;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px, transparent 44px,
      #8a6a3a 44px, #8a6a3a 52px,
      transparent 52px, transparent 96px
    );
    z-index: 3;
  }
  .note-inner { margin-left: 28px; padding: 0; position: relative; }

  /* 罫線 */
  .note-lines {
    position: absolute; inset: 0; left: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px, transparent 27px,
      #b8d4f0 27px, #b8d4f0 28px
    );
    pointer-events: none; z-index: 0;
  }
  /* 縦の赤線（余白線） */
  .note-margin {
    position: absolute; left: 40px; top: 0; bottom: 0; width: 2px;
    background: #f4a0a0; z-index: 1; pointer-events: none;
  }

  .note-content { position: relative; z-index: 2; padding: 12px 16px 16px 48px; }

  /* 日付行 */
  .note-date {
    font-size: 11px; color: #999; text-align: right;
    line-height: 28px; margin-bottom: 0;
  }
  /* 科目ラベル */
  .note-subject-label {
    display: inline-block;
    background: linear-gradient(90deg, #ff6b9d, #ffa94d);
    color: #fff; font-size: 11px; font-weight: 700;
    padding: 2px 10px; border-radius: 20px;
    margin-bottom: 4px;
  }
  /* めあて */
  .note-aim-box {
    border: 2px solid #f4a0a0;
    border-radius: 6px;
    padding: 6px 10px;
    margin-bottom: 4px;
    background: #fff8f8;
  }
  .note-aim-label {
    font-size: 10px; font-weight: 900; color: #e05050;
    letter-spacing: 1px; margin-bottom: 2px;
  }
  .note-aim-text {
    font-size: 14px; font-weight: 700; color: #333;
    line-height: 28px;
  }
  /* 本文エリア */
  .note-body { margin: 4px 0; }
  .note-section-title {
    font-size: 12px; font-weight: 900; color: #3a6bc4;
    line-height: 28px; border-bottom: 1px dashed #b8d4f0;
    margin-bottom: 0;
  }
  .note-body-line {
    font-size: 13px; color: #333;
    line-height: 28px; min-height: 28px;
    display: flex; align-items: center; gap: 8px;
  }
  .note-body-line .bullet {
    color: #ff6b9d; font-size: 10px; flex-shrink: 0;
  }
  .note-blank-line {
    height: 28px; border-bottom: none;
  }
  .note-dotted-box {
    border: 2px dashed #c8d8f0;
    border-radius: 6px; min-height: 56px;
    margin: 4px 0;
    display: flex; align-items: center; justify-content: center;
    color: #aac0e0; font-size: 12px;
    background: rgba(200,216,240,0.08);
  }
  /* まとめ */
  .note-summary-box {
    border: 2px solid #7cb87c;
    border-radius: 6px;
    padding: 6px 10px;
    margin-top: 4px;
    background: #f5fbf5;
  }
  .note-summary-label {
    font-size: 10px; font-weight: 900; color: #3a8a3a;
    letter-spacing: 1px; margin-bottom: 2px;
  }
  .note-summary-text {
    font-size: 13px; color: #333; line-height: 28px;
  }
  /* 閉じるボタン */
  .note-close-bar {
    padding: 12px 16px; text-align: center;
  }
  .btn-close-note {
    padding: 12px 32px; border-radius: 50px; border: none;
    background: linear-gradient(90deg, #ff6b9d, #ffa94d);
    color: #fff; font-size: 15px; font-weight: 800;
    cursor: pointer; font-family: inherit;
  }

  /* 表スペース */
  .note-table-space {
    width: 100%; border-collapse: collapse; margin: 4px 0;
    font-size: 12px;
  }
  .note-table-space th {
    background: #e8f0fb; border: 1.5px solid #b8d0f0;
    padding: 4px 6px; text-align: center; font-weight: 700; color: #3a5a9a;
    line-height: 22px;
  }
  .note-table-space td {
    border: 1.5px solid #b8d0f0; padding: 0;
    height: 28px; min-width: 40px;
  }
  /* グラフ枠 */
  .note-graph-box {
    border: 1.5px solid #b8d0f0; border-radius: 6px;
    margin: 4px 0; padding: 4px 8px;
    background: #f8fbff;
  }
  .note-graph-title {
    font-size: 11px; color: #3a6bc4; font-weight: 700; margin-bottom: 2px;
  }
  .note-graph-area {
    position: relative; height: 80px;
    border-left: 2px solid #7090c0; border-bottom: 2px solid #7090c0;
    margin: 0 4px;
    background: repeating-linear-gradient(
      to right, transparent 0, transparent 24px, #ddeeff 24px, #ddeeff 25px
    ),
    repeating-linear-gradient(
      to bottom, transparent 0, transparent 19px, #ddeeff 19px, #ddeeff 20px
    );
  }
  .note-graph-hint { font-size: 10px; color: #90a8d0; text-align: right; margin-top: 2px; }
  /* スケッチ枠 */
  .note-sketch-box {
    border: 2px dashed #c8d8a0; border-radius: 6px;
    margin: 4px 0; min-height: 72px;
    background: #fafff5;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 4px;
  }
  .note-sketch-icon { font-size: 22px; opacity: 0.5; }
  .note-sketch-hint { font-size: 11px; color: #8aaa60; }
  /* 観察記録枠 */
  .note-observe-box {
    border: 1.5px solid #d0b8f0; border-radius: 6px;
    margin: 4px 0; padding: 4px 8px;
    background: #fdf8ff;
  }
  .note-observe-row {
    display: flex; gap: 8px; align-items: flex-start;
  }
  .note-observe-sketch {
    border: 1.5px dashed #c0a0e8; border-radius: 4px;
    min-width: 72px; height: 72px;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: #b090d8; flex-shrink: 0;
    background: #fdf5ff;
  }
  .note-observe-lines { flex: 1; }
  .note-observe-line {
    border-bottom: 1px solid #d0b8f0; height: 28px; margin-bottom: 0;
  }
  /* インタビュー・会話枠 */
  .note-interview-box {
    border: 1.5px solid #f0c890; border-radius: 6px;
    margin: 4px 0; padding: 6px 8px;
    background: #fffbf0;
  }
  .note-interview-q {
    font-size: 12px; font-weight: 700; color: #c07020; margin-bottom: 2px;
  }
  .note-interview-a {
    border-bottom: 1px solid #f0c890; height: 28px; margin-bottom: 6px;
  }
  /* 比較表 */
  .note-compare-box {
    margin: 4px 0;
  }
  /* 作文・文章枠 */
  .note-writing-lines {
    margin: 4px 0;
  }
  .note-writing-line {
    border-bottom: 1px solid #b8d4f0; height: 28px;
  }
  /* タイムライン枠 */
  .note-timeline {
    margin: 4px 0; padding-left: 8px;
    border-left: 3px solid #ffa94d;
  }
  .note-tl-item {
    position: relative; padding: 2px 0 2px 16px; min-height: 28px;
    font-size: 12px; color: #555;
  }
  .note-tl-item::before {
    content: ''; position: absolute; left: -7px; top: 10px;
    width: 10px; height: 10px; border-radius: 50%;
    background: #ffa94d; border: 2px solid #fff;
    box-shadow: 0 0 0 1.5px #ffa94d;
  }
  .note-tl-dot-line {
    border-bottom: 1px dashed #f0c890; height: 24px; margin-left: 16px;
  }
  /* チェックリスト */
  .note-checklist { margin: 4px 0; }
  .note-check-item {
    display: flex; align-items: center; gap: 8px;
    height: 28px; font-size: 13px; color: #444;
  }
  .note-checkbox {
    width: 16px; height: 16px; border: 2px solid #aaa;
    border-radius: 3px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }

  /* ページ番号 */
  .note-page-num {
    text-align: right; font-size: 10px; color: #bbb;
    line-height: 28px; padding-right: 4px;
  }

  /* ===== ルーレット ===== */
  #roulette-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.6); z-index: 900;
    align-items: center; justify-content: center;
  }
  #roulette-overlay.active { display: flex; }
  .roulette-box {
    background: #fff; border-radius: 24px;
    padding: 32px 28px; text-align: center;
    box-shadow: 0 12px 48px rgba(0,0,0,0.3);
    min-width: 260px;
  }
  .roulette-emoji {
    font-size: 64px;
    animation: spin 0.12s linear infinite;
    display: block; margin-bottom: 12px;
  }
  @keyframes spin {
    0%   { transform: rotate(0deg) scale(1); }
    50%  { transform: rotate(180deg) scale(1.15); }
    100% { transform: rotate(360deg) scale(1); }
  }
  .roulette-text {
    font-size: 18px; font-weight: 900; color: #ff6b9d;
    letter-spacing: 2px;
    animation: blink 0.4s ease infinite alternate;
  }
  @keyframes blink { from { opacity:1; } to { opacity:0.4; } }

  /* ===== 難易度バッジ ===== */
  .difficulty-row {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 10px; flex-wrap: wrap;
  }
  .diff-badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 10px; border-radius: 20px;
    font-size: 12px; font-weight: 700;
  }
  .diff-1 { background: #e8f8e8; color: #3a8a3a; border: 1.5px solid #90d090; }
  .diff-2 { background: #fff8e0; color: #b07800; border: 1.5px solid #f0c840; }
  .diff-3 { background: #ffeaea; color: #c03030; border: 1.5px solid #f09090; }
  .time-badge {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 4px 10px; border-radius: 20px;
    font-size: 12px; font-weight: 700;
    background: #f0f4ff; color: #3a5ac0; border: 1.5px solid #a0b4f0;
  }

  /* ===== お気に入り ===== */
  .fav-btn {
    background: none; border: none; cursor: pointer;
    font-size: 26px; padding: 4px; line-height: 1;
    transition: transform 0.2s;
  }
  .fav-btn:active { transform: scale(1.3); }
  #fav-section {
    margin-top: 24px; display: none;
  }
  #fav-section.has-items { display: block; }
  .fav-section-title {
    font-size: 15px; font-weight: 800; color: #555;
    margin-bottom: 10px; display: flex; align-items: center; gap: 6px;
  }
  .fav-list { display: flex; flex-direction: column; gap: 8px; }
  .fav-item {
    background: #fff; border-radius: 14px;
    border: 2px solid #ffe0ec;
    padding: 10px 14px;
    display: flex; align-items: center; gap: 10px;
    cursor: pointer;
    transition: box-shadow 0.15s;
  }
  .fav-item:active { box-shadow: 0 4px 12px rgba(255,107,157,0.3); }
  .fav-item-emoji { font-size: 22px; flex-shrink: 0; }
  .fav-item-body { flex: 1; min-width: 0; }
  .fav-item-title {
    font-size: 13px; font-weight: 700; color: #333;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .fav-item-sub { font-size: 11px; color: #aaa; margin-top: 2px; }
  .fav-item-del {
    background: none; border: none; cursor: pointer;
    font-size: 18px; color: #ccc; padding: 4px; flex-shrink: 0;
  }
  .fav-empty {
    text-align: center; color: #bbb; font-size: 13px; padding: 12px;
  }

  /* ===== スタンプ ===== */
  #stamp-overlay {
    display: none; position: fixed; inset: 0;
    z-index: 950; pointer-events: none;
    align-items: center; justify-content: center;
  }
  #stamp-overlay.active { display: flex; }
  .stamp-img {
    font-size: 100px;
    animation: stampIn 0.5s cubic-bezier(0.17,0.89,0.32,1.28) forwards;
    opacity: 0;
  }
  @keyframes stampIn {
    0%   { opacity:0; transform: scale(3) rotate(-15deg); }
    60%  { opacity:1; transform: scale(0.9) rotate(4deg); }
    80%  { transform: scale(1.05) rotate(-2deg); }
    100% { opacity:1; transform: scale(1) rotate(0deg); }
  }
  .stamp-out { animation: stampOut 0.4s ease forwards; }
  @keyframes stampOut {
    0%   { opacity:1; transform: scale(1); }
    100% { opacity:0; transform: scale(0.6) translateY(-20px); }
  }
  .btn-stamp {
    width: 100%; padding: 14px; border-radius: 16px; margin-top: 10px;
    border: 2px solid #f0c000; background: linear-gradient(90deg,#fff7d0,#fff0a0);
    color: #b08000; font-size: 16px; font-weight: 900;
    cursor: pointer; font-family: inherit;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn-stamp.stamped {
    border-color: #ffa94d; background: linear-gradient(90deg,#ffe0a0,#ffcf70);
    color: #7a5000;
  }
  .stamp-count-badge {
    background: #ff6b9d; color: #fff;
    font-size: 11px; font-weight: 900;
    padding: 2px 7px; border-radius: 20px; margin-left: 4px;
  }

</style>
</head>
<body>
<header>
  <div class="icon">📚✨</div>
  <h1>じがくネタジェネレーター</h1>
  <p>きょうの自主学習、なにしよう？</p>
</header>

<main>
  <div class="section">
    <div class="section-label">🎒 ① 何年生？</div>
    <div class="chips" id="grade-chips"></div>
  </div>

  <div class="section">
    <div class="section-label">🖊️ ② きょうかは？</div>
    <div class="subject-grid" id="subject-grid"></div>
  </div>

  <button id="generate-btn" disabled>✨ ネタをだして！</button>

  <div id="result-area">
    <div class="result-card">
      <div class="result-header">
        <div style="display:flex;justify-content:flex-end;margin-bottom:4px">
          <button class="fav-btn" id="fav-btn" onclick="toggleFav()" title="お気に入り">🤍</button>
        </div>
        <div class="result-emoji" id="r-emoji"></div>
        <div class="result-title" id="r-title"></div>
      </div>
      <div class="difficulty-row" id="r-difficulty"></div>
      <div class="result-desc" id="r-desc"></div>
      <div class="steps-label">📋 やりかた</div>
      <div id="r-steps"></div>
      <div class="tip-box" id="r-tip"></div>
      <div class="result-buttons">
        <button class="btn-another" onclick="generate()">🔄 べつのネタ</button>
        <button class="btn-reset" onclick="resetAll()">🏠 はじめから</button>
      </div>
      <button class="btn-stamp" id="stamp-btn" onclick="pressStamp()">⭐ できた！スタンプをおす</button>
      <button class="btn-note" onclick="showNote()">📓 ノートの書き方を見る</button>
    </div>
  </div>

  <!-- ノートモーダル -->
  <div id="note-modal" onclick="closeNoteModal(event)">
    <div class="note-wrap">
      <div class="note-book">
        <div class="note-inner">

        "tip": "夢は具体的に書けば書くほど実現に近づくよ！"
      }
    ]
  }
};

// ===== 教科・学年定義 =====
const GRADES = ["1年生","2年生","3年生","4年生","5年生","6年生"];
const SUBJECTS = [
  { id:"kokugo",  label:"国語",     emoji:"📖" },
  { id:"sansu",   label:"算数",     emoji:"🔢" },
  { id:"rika",    label:"理科",     emoji:"🔬" },
  { id:"shakai",  label:"社会",     emoji:"🌏" },
  { id:"eigo",    label:"英語",     emoji:"🌟" },
  { id:"zukotai", label:"図工・工作",emoji:"🎨" },
  { id:"ongaku",  label:"音楽",     emoji:"🎵" },
  { id:"nandemo", label:"なんでも！",emoji:"🎲" },
];

function gradeGroup(g) {
  const n = parseInt(g);
  if (n <= 2) return "低";
  if (n <= 4) return "中";
  return "高";
}

// ===== 状態 =====
let selectedGrade = null;
let selectedSubject = null;
let lastIdx = -1;
let currentNeta = null;

// ===== 初期化 =====
window.addEventListener('DOMContentLoaded', () => {
  const gc = document.getElementById('grade-chips');
  GRADES.forEach(g => {
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.textContent = g;
    btn.onclick = () => selectGrade(g, btn);
    gc.appendChild(btn);
  });

  const sg = document.getElementById('subject-grid');
  SUBJECTS.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'subject-card';
    btn.innerHTML = `<span class="emoji">${s.emoji}</span>${s.label}`;
    btn.dataset.id = s.id;
    btn.onclick = () => selectSubject(s, btn);
    sg.appendChild(btn);
  });

  document.getElementById('generate-btn').onclick = generate;
});

function selectGrade(g, btn) {
  selectedGrade = g;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
  btn.classList.add('selected');
  updateBtn();
}

function selectSubject(s, btn) {
  selectedSubject = s;
  document.querySelectorAll('.subject-card').forEach(c => c.classList.remove('selected'));
  btn.classList.add('selected');
  updateBtn();
}

function updateBtn() {
  const btn = document.getElementById('generate-btn');
  if (selectedGrade && selectedSubject) {
    btn.classList.add('ready');
    btn.disabled = false;
  }
}

function generate() {
  if (!selectedGrade || !selectedSubject) return;
  const group = gradeGroup(selectedGrade);
  const pool = DB[selectedSubject.id][group] || [];
  if (!pool.length) return;

  // ルーレット演出
  const emojis = ['🎲','✨','🔮','🎯','💫','🌟','🎪','🎨'];
  const overlay = document.getElementById('roulette-overlay');
  const rouEmo  = document.getElementById('roulette-emoji');
  overlay.classList.add('active');
  let rouTimer = setInterval(() => {
    rouEmo.textContent = emojis[Math.floor(Math.random()*emojis.length)];
  }, 100);

  setTimeout(() => {
    clearInterval(rouTimer);
    overlay.classList.remove('active');

    // ネタ決定
    let idx;
    do { idx = Math.floor(Math.random() * pool.length); }
    while (pool.length > 1 && idx === lastIdx);
    lastIdx = idx;
    const neta = pool[idx];
    currentNeta = neta;

    // 難易度計算
    const diff = calcDifficulty(neta, selectedSubject.id);
    renderDifficulty(diff);

    document.getElementById('r-emoji').textContent = neta.emoji;
    document.getElementById('r-title').textContent = neta.title;
    document.getElementById('r-desc').textContent = neta.description;

    const stepsEl = document.getElementById('r-steps');
    stepsEl.innerHTML = '';
    neta.steps.forEach((s, i) => {
      stepsEl.innerHTML += `
        <div class="step">
          <div class="step-num">${i+1}</div>
          <div class="step-text">${s}</div>
        </div>`;
    });

    document.getElementById('r-tip').textContent = '💡 コツ: ' + neta.tip;

    // スタンプボタンリセット
    const sBtn = document.getElementById('stamp-btn');
    sBtn.classList.remove('stamped');
    sBtn.innerHTML = '⭐ できた！スタンプをおす';
    // お気に入りハートをリセット
    updateFavBtn();

    const area = document.getElementById('result-area');
    area.classList.remove('visible');
    area.style.display = 'none';
    setTimeout(() => {
      area.style.display = 'block';
      requestAnimationFrame(() => area.classList.add('visible'));
    }, 50);
    setTimeout(() => area.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
  }, 900);
}


// ===== ノートプレビュー =====
const SUBJECT_NAMES = {
  kokugo:'国語', sansu:'算数', rika:'理科', shakai:'社会',
  eigo:'英語', zukotai:'図工・工作', ongaku:'音楽', nandemo:'自由'
};

// ネタのタイトル・教科から最適なスペース種別を決定
function detectSpaceType(neta, subjectId) {
  const t = (neta.title + ' ' + neta.description).replace(/[　 ]/g,'');

  // グラフ・データ系
  if (/グラフ|折れ線|棒グラフ|度数|データ|記録/.test(t)) return 'graph';
  // 観察・スケッチ系
  if (/観察|スケッチ|かんさつ|スケッチ|観察日記|観察する/.test(t)) return 'observe';
  // 表・比較系
  if (/比べ|くらべ|表にまとめ|まとめよう|ちがい|比較|分類/.test(t) && !/作文|日記|手紙/.test(t)) return 'table';
  // インタビュー系
  if (/インタビュー|聞いて|質問/.test(t)) return 'interview';
  // 年表・タイムライン
  if (/年表|歴史|時代|流れ|順番|タイムライン/.test(t)) return 'timeline';
  // 図工・スケッチ
  if (subjectId === 'zukotai') return 'sketch';
  // 作文・日記・手紙・文章
  if (/作文|日記|手紙|文章|書いてみよう|書こう|スピーチ|意見文|小説|詩|俳句/.test(t)) return 'writing';
  // チェックリスト（やりかた系）
  if (/れんしゅう|練習|ゲーム|問題|計算|挑戦|マスター/.test(t)) return 'checklist';
  // デフォルト：汎用記録
  return 'free';
}

function buildNoteLayout(neta, subjectId, grade) {
  const sname = SUBJECT_NAMES[subjectId] || '';
  const aim = neta.title;
  const spaceType = detectSpaceType(neta, subjectId);
  const summary = neta.tip.replace(/^💡 コツ: /, '');
  return { sname, grade, aim, steps: neta.steps, spaceType, summary, subjectId };
}

function showNote() {
  if (!currentNeta || !selectedSubject || !selectedGrade) return;
  const layout = buildNoteLayout(currentNeta, selectedSubject.id, selectedGrade);
  renderNote(layout);
  document.getElementById('note-modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeNoteModal(e) {
  if (e.target === document.getElementById('note-modal')) {
    document.getElementById('note-modal').classList.remove('open');
    document.body.style.overflow = '';
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const modal = document.getElementById('note-modal');
  const observer = new MutationObserver(() => {
    if (!modal.classList.contains('open')) document.body.style.overflow = '';
  });
  observer.observe(modal, { attributes: true, attributeFilter: ['class'] });
});

// スペース種別ごとのHTMLを生成
function renderSpaceBlock(spaceType, steps) {
  switch(spaceType) {

    case 'graph':
      return `
<div class="note-graph-box">
  <div class="note-graph-title">📊 グラフ・データ記録</div>
  <div class="note-graph-area"></div>
  <div class="note-graph-hint">← よこじく（名前・時刻など）　たてじく（数）↑</div>
</div>
<div class="note-section-title">【気づいたこと】</div>
${writeLines(2)}`;

    case 'observe':
      return `
<div class="note-observe-box">
  <div class="note-section-title">【かんさつ・スケッチ】</div>

    <div class="note-observe-sketch">スケッチ<br>ここに</div>
    <div class="note-observe-lines">
      <div class="note-observe-line"></div>
      <div class="note-observe-line"></div>
      <div class="note-observe-line"></div>
      <div style="font-size:10px;color:#b090d8;margin-top:2px">気づいたこと →</div>
    </div>
  </div>
</div>`;

    case 'table':
      return `
<div class="note-section-title">【表にまとめよう】</div>
<table class="note-table-space">
  <tr>
    <th style="width:30%">名前・種類</th>
    <th>調べたこと①</th>
    <th>調べたこと②</th>
  </tr>
  <tr><td></td><td></td><td></td></tr>
  <tr><td></td><td></td><td></td></tr>
  <tr><td></td><td></td><td></td></tr>
</table>`;

    case 'interview':
      return `
<div class="note-interview-box">
  <div class="note-section-title">【インタビュー記録】</div>
  ${steps.slice(0,1).map(s=>`<div class="note-interview-q">Q. ${escHtml(s)}</div><div class="note-interview-a"></div>`).join('')}
  <div class="note-interview-q">Q. （自分で考えた質問）</div>
  <div class="note-interview-a"></div>
  <div class="note-interview-q">A. 答え・気づき</div>
  <div class="note-interview-a"></div>
</div>`;

    case 'timeline':
      return `
<div class="note-section-title">【年表・流れ】</div>
<div class="note-timeline">
  <div class="note-tl-item">時代・年：<div class="note-tl-dot-line"></div></div>
  <div class="note-tl-item">できごと：<div class="note-tl-dot-line"></div></div>
  <div class="note-tl-item">時代・年：<div class="note-tl-dot-line"></div></div>
  <div class="note-tl-item">できごと：<div class="note-tl-dot-line"></div></div>
</div>`;

    case 'sketch':
      return `
<div class="note-sketch-box">
  <div class="note-sketch-icon">🖌️</div>
  <div class="note-sketch-hint">スケッチ・デザインをここに書こう</div>
</div>
<div class="note-section-title">【工夫したこと・気づき】</div>
${writeLines(2)}`;

    case 'writing':
      return `
<div class="note-section-title">【書いてみよう】</div>
<div class="note-writing-lines">
  ${Array(5).fill('<div class="note-writing-line"></div>').join('')}
</div>`;

    case 'checklist':
      return `

  ${steps.map(s=>`

    <div class="note-checkbox"></div>
    <span>${escHtml(s)}</span>
  </div>`).join('')}
</div>
<div class="note-section-title" style="margin-top:4px">【結果・点数・気づき】</div>
${writeLines(2)}`;

    default: // free
      return `
<div class="note-section-title">【しらべたこと・きろく】</div>
<div style="border:2px dashed #c8d8f0;border-radius:6px;min-height:60px;margin:4px 0;
  display:flex;align-items:center;justify-content:center;
  color:#aac0e0;font-size:12px;background:rgba(200,216,240,0.08);">
  ここに書こう（文・絵・表など）

function writeLines(n) {
  return Array(n).fill('<div class="note-body-line" style="border-bottom:1px solid #d0e4f8;min-height:28px"></div>').join('');
}

function renderNote(layout) {
  const today = new Date();
  const dateStr = `${today.getFullYear()}年${today.getMonth()+1}月${today.getDate()}日`;

  // スペース種別ラベル
  const spaceLabels = {
    graph:'グラフ', observe:'かんさつ', table:'表', interview:'インタビュー',
    timeline:'年表', sketch:'スケッチ', writing:'作文', checklist:'チェック', free:'きろく'
  };

  let h = '';
  h += `<div class="note-date">${dateStr}</div>`;
  h += `<div style="margin-bottom:4px;display:flex;align-items:center;gap:6px">
    <span class="note-subject-label">${layout.sname}　${layout.grade}</span>
    <span style="font-size:10px;color:#888">記録スタイル：${spaceLabels[layout.spaceType] || 'きろく'}</span>
  </div>`;

  // めあて
  h += `<div class="note-aim-box">
    <div class="note-aim-label">★ め あ て</div>
    <div class="note-aim-text">${escHtml(layout.aim)}</div>
  </div>`;

  // やりかた（checklist以外）
  if (layout.spaceType !== 'checklist') {
    h += `<div class="note-section-title">【やりかた】</div>`;
    layout.steps.forEach((s,i) => {
      h += `<div class="note-body-line"><span class="bullet">▶</span>${escHtml(`${i+1}. ${s}`)}</div>`;
    });
    h += `<div class="note-blank-line"></div>`;
  }

  // 記録スペース（種別ごと）
  h += renderSpaceBlock(layout.spaceType, layout.steps);

  // まとめ
  h += `<div class="note-summary-box" style="margin-top:8px">
    <div class="note-summary-label">★ ま と め</div>
    <div class="note-summary-text">${escHtml(layout.summary)}</div>
  </div>`;
  h += `<div class="note-page-num">- 1 -</div>`;

  document.getElementById('note-content').innerHTML = h;
}

function escHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function resetAll() {
  selectedGrade = null;
  selectedSubject = null;
  lastIdx = -1;
  currentNeta = null;
  document.querySelectorAll('.chip, .subject-card').forEach(c => c.classList.remove('selected'));
  const btn = document.getElementById('generate-btn');
  btn.classList.remove('ready');
  btn.disabled = true;
  const area = document.getElementById('result-area');
  area.classList.remove('visible');
  setTimeout(() => { area.style.display = 'none'; }, 300);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ===========================
// ★ 難易度表示
// ===========================
function calcDifficulty(neta, subjectId) {
  const t = neta.title + ' ' + neta.description;
  // 難易度3（むずかしい）
  if (/論文|ディベート|批評|分析|考察|エッセイ|小説|哲学|統計|暗号|小論文/.test(t)) return 3;
  // 難易度1（かんたん）
  if (/れんしゅう|練習|おぼえ|覚え|書いてみよう|かいてみよう|えらんで|さがそう|あつめよう|まとめよう/.test(t)
    && !/調べ|分析|比較|考察/.test(t)) return 1;
  return 2;
}

const DIFF_INFO = {
  1: { label:'かんたん', stars:'★☆☆', cls:'diff-1', time:'15〜30分' },
  2: { label:'ふつう',   stars:'★★☆', cls:'diff-2', time:'30〜45分' },
  3: { label:'むずかしい',stars:'★★★', cls:'diff-3', time:'45〜60分' },
};

function renderDifficulty(level) {
  const d = DIFF_INFO[level] || DIFF_INFO[2];
  document.getElementById('r-difficulty').innerHTML = `
    <span class="diff-badge ${d.cls}">${d.stars} ${d.label}</span>
    <span class="time-badge">⏱ ${d.time}</span>`;
}

// ===========================
// ⭐ お気に入り保存
// ===========================
function getFavs() {
  try { return JSON.parse(localStorage.getItem('jigaku_favs') || '[]'); }
  catch(e) { return []; }
}
function saveFavs(favs) {
  try { localStorage.setItem('jigaku_favs', JSON.stringify(favs)); } catch(e) {}
}
function makeFavKey(neta) {
  return (neta.title || '').slice(0, 30);
}
function isFaved(neta) {
  const favs = getFavs();
  const key = makeFavKey(neta);
  return favs.some(f => f.key === key);
}
function toggleFav() {
  if (!currentNeta) return;
  let favs = getFavs();
  const key = makeFavKey(currentNeta);
  const idx = favs.findIndex(f => f.key === key);
  if (idx >= 0) {
    favs.splice(idx, 1);
  } else {
    favs.unshift({
      key,
      title: currentNeta.title,
      emoji: currentNeta.emoji,
      subjectLabel: selectedSubject ? selectedSubject.label : '',
      grade: selectedGrade || '',
      subjectId: selectedSubject ? selectedSubject.id : '',
      gradeGroup: selectedGrade ? gradeGroup(selectedGrade) : '',
      netaIdx: lastIdx,
    });
    if (favs.length > 20) favs = favs.slice(0, 20);
  }
  saveFavs(favs);
  updateFavBtn();
  renderFavList();
}
function updateFavBtn() {
  const btn = document.getElementById('fav-btn');
  if (!btn) return;
  btn.textContent = (currentNeta && isFaved(currentNeta)) ? '❤️' : '🤍';
}
function renderFavList() {
  const favs = getFavs();
  const sec = document.getElementById('fav-section');
  const list = document.getElementById('fav-list');
  const countLabel = document.getElementById('fav-count-label');
  if (!favs.length) {
    sec.classList.remove('has-items');
    return;
  }
  sec.classList.add('has-items');
  countLabel.textContent = `(${favs.length}件)`;
  list.innerHTML = favs.map((f, i) => `
    <div class="fav-item" onclick="loadFav(${i})">
      <span class="fav-item-emoji">${f.emoji}</span>
      <div class="fav-item-body">
        <div class="fav-item-title">${escHtml(f.title)}</div>
        <div class="fav-item-sub">${f.subjectLabel} ・ ${f.grade}</div>
      </div>
      <button class="fav-item-del" onclick="event.stopPropagation();deleteFav(${i})" title="削除">✕</button>
    </div>`).join('');
}
function loadFav(i) {
  const favs = getFavs();
  const f = favs[i];
  if (!f) return;
  // 教科・学年を復元してネタを表示
  const pool = (DB[f.subjectId] || {})[f.gradeGroup] || [];
  const neta = pool[f.netaIdx] || pool.find(n => n.title === f.title);
  if (!neta) return;

  // 学年・教科を選択状態に
  document.querySelectorAll('.chip').forEach(c => {
    c.classList.toggle('selected', c.textContent === f.grade);
  });
  document.querySelectorAll('.subject-card').forEach(c => {
    c.classList.toggle('selected', c.dataset.id === f.subjectId);
  });
  selectedGrade = f.grade;
  const subj = SUBJECTS.find(s => s.id === f.subjectId);
  selectedSubject = subj || null;
  const genBtn = document.getElementById('generate-btn');
  genBtn.classList.add('ready');
  genBtn.disabled = false;
  lastIdx = f.netaIdx;
  currentNeta = neta;

  const diff = calcDifficulty(neta, f.subjectId);
  renderDifficulty(diff);
  document.getElementById('r-emoji').textContent = neta.emoji;
  document.getElementById('r-title').textContent = neta.title;
  document.getElementById('r-desc').textContent = neta.description;
  const stepsEl = document.getElementById('r-steps');
  stepsEl.innerHTML = '';
  neta.steps.forEach((s, idx2) => {
    stepsEl.innerHTML += `<div class="step"><div class="step-num">${idx2+1}</div><div class="step-text">${s}</div></div>`;
  });
  document.getElementById('r-tip').textContent = '💡 コツ: ' + neta.tip;
  const sBtn = document.getElementById('stamp-btn');
  sBtn.classList.remove('stamped');
  sBtn.innerHTML = '⭐ できた！スタンプをおす';
  updateFavBtn();

  const area = document.getElementById('result-area');
  area.classList.remove('visible');
  area.style.display = 'none';
  setTimeout(() => {
    area.style.display = 'block';
    requestAnimationFrame(() => area.classList.add('visible'));
  }, 50);
  setTimeout(() => area.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
}
function deleteFav(i) {
  const favs = getFavs();
  favs.splice(i, 1);
  saveFavs(favs);
  renderFavList();
  if (currentNeta) updateFavBtn();
}

// ===========================
// スタンプ機能
// ===========================
const STAMPS = ['⭐','🌟','✨','🎉','🏅','🎊','💯','👑','🦄','🌈'];
let stampCount = 0;

function pressStamp() {
  const btn = document.getElementById('stamp-btn');
  if (btn.classList.contains('stamped')) return;
  stampCount++;
  const stamp = STAMPS[Math.floor(Math.random() * STAMPS.length)];
  // オーバーレイ表示
  const overlay = document.getElementById('stamp-overlay');
  const img = document.getElementById('stamp-img');
  img.textContent = stamp;
  img.className = 'stamp-img';
  overlay.classList.add('active');
  // 1秒後にフェードアウト
  setTimeout(() => {
    img.classList.add('stamp-out');
    setTimeout(() => {
      overlay.classList.remove('active');
      img.classList.remove('stamp-out');
    }, 400);
  }, 900);
  // ボタンを「できた！」状態に
  btn.classList.add('stamped');
  btn.innerHTML = `${stamp} やったね！できた！ <span class="stamp-count-badge">${stampCount}</span>`;
}

// ===========================
// 初期化：お気に入りリストを表示
// ===========================
document.addEventListener('DOMContentLoaded', () => {
  renderFavList();
});
